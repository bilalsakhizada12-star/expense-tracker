<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Expense Tracker</h1>
    <div id="user-area" class="hidden">
      <span id="user-name"></span>
      <button id="logout-btn" class="btn btn-ghost">Log out</button>
    </div>
  </header>

  <main class="container">
    <p id="error" class="error hidden"></p>

    <!-- Auth screen -->
    <section id="auth-section" class="card">
      <h2 id="auth-title">Log in</h2>
      <form id="auth-form">
        <label id="name-label" class="hidden">Name
          <input type="text" id="name" autocomplete="name" placeholder="Your name">
        </label>
        <label>Email
          <input type="email" id="email" required autocomplete="email" placeholder="you@example.com">
        </label>
        <label>Password
          <input type="password" id="password" required autocomplete="current-password" placeholder="At least 8 characters">
        </label>
        <button type="submit" class="btn btn-primary" id="auth-submit">Log in</button>
      </form>
      <p class="switch">
        <button id="auth-switch" class="link-btn">Need an account? Register</button>
      </p>
    </section>

    <!-- Dashboard -->
    <section id="dashboard" class="hidden">
      <div class="filters card">
        <label>Month
          <input type="month" id="month-filter">
        </label>
        <label>Category
          <select id="category-filter">
            <option value="">All categories</option>
          </select>
        </label>
      </div>

      <div class="summary card">
        <h2>Summary <span id="summary-month"></span></h2>
        <p class="total">Total spent: <strong id="summary-total">0</strong></p>
        <div id="category-bars"></div>
      </div>

      <div class="card">
        <h2 id="form-title">Add expense</h2>
        <form id="expense-form">
          <div class="form-row">
            <label>Amount
              <input type="number" id="amount" min="0.01" step="0.01" required placeholder="0.00">
            </label>
            <label>Category
              <select id="category" required></select>
            </label>
            <label>Date
              <input type="date" id="date" required>
            </label>
          </div>
          <label>Note
            <input type="text" id="note" maxlength="500" placeholder="What was this for? (optional)">
          </label>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="expense-submit">Add expense</button>
            <button type="button" class="btn btn-ghost hidden" id="expense-cancel">Cancel edit</button>
          </div>
        </form>
      </div>

      <div class="card">
        <h2>Expenses</h2>
        <ul id="expense-list" class="expense-list"></ul>
        <p id="empty-state" class="muted hidden">No expenses yet for this month.</p>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
